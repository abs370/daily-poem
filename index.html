<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3e8">
  <meta name="description" content="每天一篇古诗词，附译文、注释与赏析，支持语音朗读与收藏。">
  <title>每日一诗 · 古诗词阅读</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">每日一诗</h1>
    <p class="app-date" id="today-date"></p>
  </header>

  <main class="app-main">

    <!-- 今日一篇 -->
    <section class="tab-panel" id="tab-today">
      <article class="poem-card" id="poem-card">
        <header class="poem-head">
          <h2 class="poem-title" id="poem-title"></h2>
          <p class="poem-meta" id="poem-meta"></p>
        </header>

        <div class="poem-content" id="poem-content"></div>

        <div class="poem-actions">
          <button class="btn btn-read" id="btn-read" type="button">
            <span class="btn-icon" id="read-icon">▶</span><span id="read-label">朗读</span>
          </button>
          <button class="btn btn-fav" id="btn-fav" type="button">
            <span class="btn-icon" id="fav-icon">☆</span><span id="fav-label">收藏</span>
          </button>
        </div>

        <div class="poem-sections">
          <details class="poem-section" id="sec-translation">
            <summary>白话译文</summary>
            <p id="poem-translation"></p>
          </details>
          <details class="poem-section" id="sec-notes">
            <summary>字词注释</summary>
            <ul id="poem-notes"></ul>
          </details>
          <details class="poem-section" id="sec-appreciation">
            <summary>赏析</summary>
            <p id="poem-appreciation"></p>
          </details>
        </div>
      </article>

      <nav class="poem-nav">
        <button class="btn btn-nav" id="btn-prev" type="button">← 上一篇</button>
        <span class="nav-counter" id="nav-counter"></span>
        <button class="btn btn-nav" id="btn-next" type="button">下一篇 →</button>
      </nav>
    </section>

    <!-- 历史 -->
    <section class="tab-panel hidden" id="tab-history">
      <h2 class="panel-title">阅读历史</h2>
      <ul class="list" id="history-list"></ul>
      <p class="empty-tip hidden" id="history-empty">还没有阅读记录，去「今日」读一篇吧。</p>
    </section>

    <!-- 收藏 -->
    <section class="tab-panel hidden" id="tab-favs">
      <h2 class="panel-title">我的收藏</h2>
      <ul class="list" id="fav-list"></ul>
      <p class="empty-tip hidden" id="fav-empty">还没有收藏，遇到喜欢的诗点「收藏」吧。</p>
    </section>

  </main>

  <nav class="bottom-tabs">
    <button class="tab-btn active" data-tab="today" type="button"><span class="tab-icon">📖</span>今日</button>
    <button class="tab-btn" data-tab="history" type="button"><span class="tab-icon">🕘</span>历史</button>
    <button class="tab-btn" data-tab="favs" type="button"><span class="tab-icon">⭐</span>收藏</button>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
